<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a8a0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7b3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Glow effect -->
  <circle cx="64" cy="64" r="45" fill="url(#glowGradient)"/>
  
  <!-- Sun center (brightness symbol) -->
  <circle cx="64" cy="64" r="20" fill="url(#sunGradient)"/>
  
  <!-- Sun rays -->
  <g stroke="url(#sunGradient)" stroke-width="4" stroke-linecap="round">
    <!-- Top ray -->
    <line x1="64" y1="20" x2="64" y2="32"/>
    <!-- Top-right ray -->
    <line x1="88" y1="28" x2="80" y2="36"/>
    <!-- Right ray -->
    <line x1="100" y1="64" x2="88" y2="64"/>
    <!-- Bottom-right ray -->
    <line x1="88" y1="100" x2="80" y2="92"/>
    <!-- Bottom ray -->
    <line x1="64" y1="108" x2="64" y2="96"/>
    <!-- Bottom-left ray -->
    <line x1="28" y1="100" x2="36" y2="92"/>
    <!-- Left ray -->
    <line x1="20" y1="64" x2="32" y2="64"/>
    <!-- Top-left ray -->
    <line x1="28" y1="28" x2="36" y2="36"/>
  </g>
  
  <!-- Color temperature indicator (warm arc at bottom) -->
  <path d="M 40 90 Q 64 100 88 90" 
        stroke="url(#warmGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Small warm dots -->
  <circle cx="48" cy="88" r="2" fill="#ff9a56"/>
  <circle cx="64" cy="92" r="2" fill="#ff9a56"/>
  <circle cx="80" cy="88" r="2" fill="#ff9a56"/>
</svg>
